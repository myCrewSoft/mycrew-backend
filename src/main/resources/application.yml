spring:
  application:
    name: mycrewsoft

  datasource:
    url: jdbc:oracle:thin:@localhost:1521:XE
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# Redis
#  data:
#    redis:
#      host: localhost
#      port: 6379
#      timeout: 3000

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.mycrewsoft.app.domain.vo

  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

logging:
  level:
    com.projectname.app.mapper: DEBUG
    org.springframework.security: DEBUG

server:
  port: 80

cors:
  allowed-origins: http://localhost:5173
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: Authorization,Content-Type,Accept
  allow-credentials: true
  max-age: 3600
  exposed-headers: Content-Type,Cache-Control,X-Accel-Buffering
 
file:
  upload-path: ${LOCAL_STORAGE}

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:727057848148-08dmtdfppmnoqblbukb3aegv1avmq6c9.apps.googleusercontent.com}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirect-uri: http://localhost/api/mail/oauth/google/callback
    frontend-success-uri: http://localhost:5173/first-login?mailConnected=Y
    frontend-failure-uri: http://localhost:5173/first-login?mailConnected=N
    scopes:
      - openid
      - email
      - profile
      - https://www.googleapis.com/auth/gmail.readonly
      - https://www.googleapis.com/auth/gmail.send

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    url: /api/v3/api-docs